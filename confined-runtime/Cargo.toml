[package]
name = "lantern-confined-runtime"
version = "0.0.0"
edition = "2021"
description = "RFC-0018's confined lantern-runtime process: one standalone riscv64 program that hosts a real, signed Wasm guest package (.lpkg, verified before deserialize) under Wasmtime no_std + Pulley, wiring its host interface from the package's own manifest -- keystore (IpcKeystore, confined-probe-guest) or filesystem (IpcFilesystem, confined-fs-guest), served over a real shared Frame by a separately confined service. Loaded by lantern-boot's runtime demos."
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "lantern_confined_runtime"
path = "src/lib.rs"
# Bare-metal riscv64 only: there is no `test` crate for this target.
test = false
doctest = false

[[bin]]
# Both proofs, one binary: lantern-boot-runtime-demo and lantern-boot-runtime-fs-demo.
name = "lantern-confined-runtime"
path = "src/main.rs"

[dependencies]
# `lantern-runtime` is this repo's own root crate (a path dependency); the rest are their
# own `lantern-os` repos.
lantern-runtime = { path = "..", default-features = false, features = ["confined"] }
lantern-abi = { git = "https://github.com/lantern-os/lantern-abi", branch = "main", features = ["rt"] }
lantern-crypto = { git = "https://github.com/lantern-os/lantern-crypto", branch = "main", default-features = false }
lantern-filesystem = { git = "https://github.com/lantern-os/lantern-filesystem", branch = "main", default-features = false }
# `no_std`: the `.lpkg` container + its signature check, and the manifest parser.
lantern-sdk = { git = "https://github.com/lantern-os/lantern-sdk", branch = "main", default-features = false, features = ["manifest"] }
# Same feature set lantern-runtime's `confined` role already selects (ADR-0023); named
# here only for the `Store`/typed-func API this binary calls directly.
wasmtime = { version = "48", default-features = false, features = ["runtime", "component-model", "pulley"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
# `lantern-boot` embeds this ELF in its own kernel image, which reserves two 2 MiB
# megapages (`lantern-boot/linker.ld`); symbols alone would overflow it.
strip = true
